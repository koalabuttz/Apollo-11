# Native C64 port CI. See c64-port/CONTRIBUTING-port.md.
name: port-ci
on:
  push:
    branches: ['port/**']
    paths: ['c64-port/**', 'Luminary099/**', 'Comanche055/**', '.github/workflows/port-*.yml']
  pull_request:
    branches: ['port/**']
  workflow_dispatch:
    inputs:
      full:
        description: Run every host, sanitizer and C64 target
        type: boolean
        default: true
  workflow_call:
    inputs:
      ref:
        type: string
        default: port/c64-native-c
      full:
        type: boolean
        default: true

# Full runs (dispatch, nightly) get their own group, so a merge's push run
# never cancels a queued full run on the same branch, or waits behind one.
concurrency:
  group: port-ci-${{ github.event.pull_request.number || inputs.ref || github.ref }}-${{ inputs.full && 'full' || 'affected' }}
  # A newer push supersedes a PR's affected run. Base (push) runs finish:
  # merges land minutes apart, so cancelling left base with almost no
  # completed run (1 of 20 on 10-15). GitHub keeps only the newest pending
  # run per group, so base runs at most one behind. Full runs (nightly,
  # manual) always finish, since the vice manifest comes from them.
  cancel-in-progress: ${{ !inputs.full && github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  REF: ${{ inputs.ref || github.sha }}
  FULL: ${{ inputs.full && '1' || '0' }}
  SKIP_EVIDENCE_RESTORE: '1'

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      base: ${{ steps.plan.outputs.base }}
      shared: ${{ steps.plan.outputs.shared }}
      affected: ${{ steps.plan.outputs.affected }}
      host: ${{ steps.plan.outputs.host }}
      c64: ${{ steps.plan.outputs.c64 }}
      full: ${{ steps.plan.outputs.full }}
      c64_shards: ${{ steps.plan.outputs.c64_shards }}
      host_shards: ${{ steps.plan.outputs.host_shards }}
      c64_full: ${{ steps.plan.outputs.c64_full }}
      c64_nshards: ${{ steps.plan.outputs.c64_nshards }}
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - &checkout
        name: Lean checkout
        run: |
          git init -q .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}"
          git config http.https://github.com/.extraheader \
            "AUTHORIZATION: basic $(printf 'x-access-token:%s' '${{ github.token }}' | base64 -w0)"
          git fetch -q --filter=blob:limit=1m --depth=1 origin "$REF"
          git show FETCH_HEAD:c64-port/tools/ci_checkout.sh | bash -s FETCH_HEAD
      # A nightly calls this workflow with a branch name as ref: every later
      # job checks out the commit plan resolved, not the branch tip at its own
      # start (shards built different commits, and the manifest mixed them).
      - id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - id: plan
        working-directory: c64-port
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          HEAD_REF: ${{ github.head_ref || github.ref_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          # A PR's base is the merge ref's first parent: the event's base.sha can
          # be older when the base moved before GitHub built the merge ref.
          if [ "$EVENT" = pull_request ]; then base=$(git rev-parse -q --verify HEAD^1 || echo "$PR_BASE")
          elif [ "$EVENT" = push ] && [ "$HEAD_REF" = port/c64-native-c ] && [ -n "$BEFORE" ] \
               && [ "$BEFORE" != 0000000000000000000000000000000000000000 ]; then base=$BEFORE
          else base=$(git merge-base HEAD origin/port/c64-native-c)
          fi
          case "$HEAD_REF" in port/pipeline/*) shared=1 ;; *) shared=0 ;; esac
          if [ "$FULL" = 1 ] || [ "$EVENT" = schedule ]; then
            affected='{"full": true}'
          else
            affected=$(python3 tools/ci_affected.py --base "$base" | tr -d '\n')
          fi
          echo "$affected"
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "shared=$shared" >> "$GITHUB_OUTPUT"
          echo "affected=$affected" >> "$GITHUB_OUTPUT"
          echo "host=$(echo "$affected" | python3 -c 'import json,sys;a=json.load(sys.stdin);print(int(a["full"] or bool(a["test"] or a["sanitize"])))')" >> "$GITHUB_OUTPUT"
          # A merge's push run on the port branch skips the C64/VICE shards: its PR
          # already ran them, and the nightly runs every C64 check on the branch
          # (David, 10-23). c64-maps still links every PRG on each push.
          post_merge=0
          if [ "$EVENT" = push ] && [ "$HEAD_REF" = port/c64-native-c ] && [ "$FULL" != 1 ]; then post_merge=1; fi
          c64=$(echo "$affected" | python3 -c 'import json,sys;a=json.load(sys.stdin);print(int(a["full"] or bool(a["c64"])))')
          [ "$post_merge" = 1 ] && c64=0
          echo "c64=$c64" >> "$GITHUB_OUTPUT"
          echo "full=$(echo "$affected" | python3 -c 'import json,sys;print(int(json.load(sys.stdin)["full"]))')" >> "$GITHUB_OUTPUT"
          # A full c64 run is over two hours of builds and VICE: split it.
          c64_full=$(echo "$affected" | python3 -c 'import json,sys;a=json.load(sys.stdin);print(int(a.get("c64_full", a["full"])))')
          [ "$post_merge" = 1 ] && c64_full=0
          echo "c64_full=$c64_full" >> "$GITHUB_OUTPUT"
          # A PR's own c64 list gets a runner per hour of measured target time
          # (tools/ci_target_seconds.json), up to 4: shared kernel PRs pick
          # 9+ VICE targets of 5-25 minutes each.
          if [ "$c64_full" = 1 ]; then c64_n=4
          else
            c64_n=$(echo "$affected" | python3 -c 'import json,sys;a=json.load(sys.stdin);print(" ".join(a.get("c64",[])+a.get("vice",[])))' \
                    | xargs python3 tools/ci_run.py --count-shards 4 2>/dev/null | tail -1)
            case "$c64_n" in [1-4]) ;; *) c64_n=1 ;; esac
          fi
          echo "c64_nshards=$c64_n" >> "$GITHUB_OUTPUT"
          echo "c64_shards=$(python3 -c "print(list(range($c64_n)))")" >> "$GITHUB_OUTPUT"
          # A full host run is about 1,000 targets and an hour on one runner.
          full=$(echo "$affected" | python3 -c 'import json,sys;print(int(json.load(sys.stdin)["full"]))')
          echo "host_shards=$([ "$full" = 1 ] && echo '[0,1,2,3]' || echo '[0]')" >> "$GITHUB_OUTPUT"

  ledgers-and-coverage:
    needs: plan
    env:
      REF: ${{ needs.plan.outputs.sha }}
    runs-on: ubuntu-24.04
    steps:
      - *checkout
      - name: Shared-ledger guard
        if: github.event_name == 'pull_request'
        working-directory: c64-port
        env:
          GH_TOKEN: ${{ github.token }}   # reads the nightly vice-manifest artifact
        run: |
          python3 tools/ci_guard.py --base "${{ needs.plan.outputs.base }}" --remote \
            ${{ needs.plan.outputs.shared == '1' && '--allow-shared' || '' }}
      - name: Milestone files render
        working-directory: c64-port
        run: python3 tools/ledgers.py --validate
      - name: Each make variable is assigned in one tools/mk file
        working-directory: c64-port
        run: python3 tools/mk_vars_check.py
      # Every branch arm no frozen host case takes is triaged in
      # tools/cert_arms_allow.py with a class and a reason; fails on an
      # untriaged one, warns on open flight gaps and stale records.
      - name: Certificate arms are triaged
        working-directory: c64-port
        run: python3 tools/cert_arms.py check
      - name: Differential step-cap loop classification
        working-directory: c64-port
        run: python3 tools/interp_loops_test.py
      - name: Differential edge-value writes stay in erasable
        working-directory: c64-port
        run: python3 tools/interp_edges_test.py
      - name: Coverage audit
        working-directory: c64-port
        run: |
          python3 tools/evidence.py fetch --coverage
          python3 tools/port_coverage.py

  # Reports C lines a PR changed but left unformatted (tools/format_changed.py,
  # .clang-format). Advisory while lanes install the hook (`make hooks`): it
  # warns and passes.
  format:
    needs: plan
    if: github.event_name == 'pull_request'
    env:
      REF: ${{ needs.plan.outputs.sha }}
    runs-on: ubuntu-24.04
    steps:
      - *checkout
      - name: Toolchain cache (read only)
        uses: actions/cache/restore@v4
        with:
          path: |
            c64-port/deps/llvm-mos
            c64-port/deps/vice-data
            c64-port/deps/virtualagc
            c64-port/deps/fixture
          key: port-deps-${{ hashFiles('c64-port/tools/versions.json', 'c64-port/tools/setup_cloud.sh', 'c64-port/tools/prepare_reference.py') }}
      - name: Changed C lines are formatted
        working-directory: c64-port
        run: |
          if [ ! -x deps/llvm-mos/bin/clang-format ]; then
            echo "::warning::format check skipped: toolchain cache missed"; exit 0
          fi
          if ! python3 tools/format_changed.py --check --base "${{ needs.plan.outputs.base }}" > build-format.diff; then
            cat build-format.diff
            echo "::warning::changed C lines are not formatted; run 'make format' (installs the pre-commit hook)"
          fi

  host:
    needs: plan
    env:
      REF: ${{ needs.plan.outputs.sha }}
    if: needs.plan.outputs.host == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.host_shards) }}
    steps:
      - *checkout
      - &deps
        name: Toolchain cache
        uses: actions/cache@v4
        with:
          path: |
            c64-port/deps/llvm-mos
            c64-port/deps/vice-data
            c64-port/deps/virtualagc
            c64-port/deps/fixture
          key: port-deps-${{ hashFiles('c64-port/tools/versions.json', 'c64-port/tools/setup_cloud.sh', 'c64-port/tools/prepare_reference.py') }}
      - &setup
        name: Install pinned toolchain
        working-directory: c64-port
        run: tools/setup_cloud.sh
      - name: Host and sanitizer targets (shard ${{ matrix.shard }})
        working-directory: c64-port
        env:
          AFFECTED: ${{ needs.plan.outputs.affected }}
          SHARD: ${{ matrix.shard }}
        run: |
          source deps/env.sh
          targets=$(echo "$AFFECTED" | python3 -c 'import json,sys;a=json.load(sys.stdin);print(" ".join(a.get("test",[])+a.get("sanitize",[])))')
          if echo "$AFFECTED" | grep -q '"full": true'; then
            python3 tools/ci_run.py --group test --group sanitize --group ci-extra-host --shard "$SHARD/4" --summary build/ci-summary.json
          else
            python3 tools/ci_run.py $targets --summary build/ci-summary.json
          fi
      - &logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.job }}${{ matrix.shard }}-logs
          path: |
            c64-port/build/ci-logs
            c64-port/build/ci-summary.json
          if-no-files-found: ignore

  c64:
    needs: plan
    env:
      REF: ${{ needs.plan.outputs.sha }}
    if: needs.plan.outputs.c64 == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 210
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.c64_shards) }}
    steps:
      - *checkout
      - *deps
      - *setup
      - name: Build C64 PRGs and run VICE checks (shard ${{ matrix.shard }})
        working-directory: c64-port
        env:
          AFFECTED: ${{ needs.plan.outputs.affected }}
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ needs.plan.outputs.c64_nshards }}
          C64_FULL: ${{ needs.plan.outputs.c64_full }}
        run: |
          source deps/env.sh
          if [ "$C64_FULL" = 1 ]; then
            # tools/mk/ci-extra.mk's C64 checks join the c64-/vice- targets.
            targets=$( (make -pRrq __none__ 2>/dev/null | sed -n 's/^\(c64-[A-Za-z0-9_-]*\|vice-[A-Za-z0-9_-]*\):.*/\1/p' | grep -v '^vice-legacy-'
                        make -pRrq __none__ 2>/dev/null | sed -n 's/^ci-extra-c64: *//p' | tr ' ' '\n') | sort -u)
          else
            targets=$(echo "$AFFECTED" | python3 -c 'import json,sys;a=json.load(sys.stdin);print(" ".join(a.get("c64",[])+a.get("vice",[])))')
          fi
          # Shards balanced by measured seconds (tools/ci_target_seconds.json).
          python3 tools/ci_run.py --make-arg "MOS_CC=$MOS_CC" $targets --shard "$SHARD/$SHARDS" --summary build/ci-summary.json
          if [ "$SHARD" = 0 ]; then
            make c64 MOS_CC="$MOS_CC" && python3 tools/vice_test.py --vice "$VICE" --rom-dir "$VICE_ROM_DIR" --data-dir "$VICE_DATA_DIR"
          fi
      - &map-check
        name: Every PRG ends below the $c000 mailbox
        if: always()
        working-directory: c64-port
        run: python3 tools/map_check.py
      - *logs
      - &piece
        name: Vice manifest piece
        if: always() && needs.plan.outputs.full == '1' && (inputs.full || github.event_name == 'schedule')
        working-directory: c64-port
        env:
          PIECE: ${{ github.job }}${{ matrix.shard }}
        run: |
          python3 tools/vice_manifest.py piece --name "$PIECE" --out "build/vice-manifest-$PIECE.json" \
            ${{ github.job == 'c64' && matrix.shard == 0 && '--certificates' || '' }}
      - &upload-piece
        if: always() && needs.plan.outputs.full == '1' && (inputs.full || github.event_name == 'schedule')
        uses: actions/upload-artifact@v4
        with:
          name: vice-manifest-${{ github.job }}${{ matrix.shard }}
          path: c64-port/build/vice-manifest-*.json
          if-no-files-found: ignore

  # On every push to the port branch (where the c64 job is skipped), link
  # every C64 PRG (no VICE) and check each map. Two PRs can each fit and still push another lane's PRG past
  # $c000 together; this shows it on the merge commit. Full runs check the
  # maps in the c64 job instead.
  c64-maps:
    needs: plan
    env:
      REF: ${{ needs.plan.outputs.sha }}
    if: github.event_name == 'push' && needs.plan.outputs.c64_full != '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    steps:
      - *checkout
      - *deps
      - *setup
      - name: Link every C64 PRG (shard ${{ matrix.shard }})
        working-directory: c64-port
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          source deps/env.sh
          targets=$(make -pRrq __none__ 2>/dev/null | sed -n 's/^\(build\/[A-Za-z0-9_.-]*\.prg\):.*/\1/p' | sort -u \
            | awk -v k="$SHARD" 'NF && (NR - 1) % 2 == k')
          echo "$(echo "$targets" | wc -w) PRGs"
          # A PRG that fails to link fails this job: on a push nothing else links it.
          if ! make -k -j"$(nproc)" MOS_CC="$MOS_CC" $targets > build/c64-maps.log 2>&1; then
            grep -E '^make: \*\*\*|error:' build/c64-maps.log | head -40
            echo "FAIL: some PRGs did not link (build/c64-maps.log)"; exit 1
          fi
      - *map-check

  # The legacy tools/*_vice_test.py scripts, as tools/mk/legacy-vice.mk
  # targets. Requested full runs only (nightly, dispatch): about 400 VICE
  # minutes, so they are split across shards. A PR or push that touches shared
  # files runs the full host and c64 jobs but not these, so shared-file PRs
  # don't take every runner for hours; the nightly catches legacy breaks.
  c64-legacy:
    needs: plan
    env:
      REF: ${{ needs.plan.outputs.sha }}
    if: needs.plan.outputs.full == '1' && (inputs.full || github.event_name == 'schedule')
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - *checkout
      - *deps
      - *setup
      - name: Legacy VICE checks (shard ${{ matrix.shard }} of 8)
        working-directory: c64-port
        run: |
          source deps/env.sh
          python3 tools/legacy_vice.py
          targets=$(python3 tools/legacy_vice.py --shard ${{ matrix.shard }}/8)
          python3 tools/ci_run.py -j 4 --make-arg "MOS_CC=$MOS_CC" --make-arg "VICE=$VICE" \
            --make-arg "VICE_ROM_DIR=$VICE_ROM_DIR" --make-arg "VICE_DATA_DIR=$VICE_DATA_DIR" \
            --make-arg "C1541=$C1541" $targets --summary build/ci-summary.json
      - *map-check
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c64-legacy-${{ matrix.shard }}-logs
          path: |
            c64-port/build/ci-logs
            c64-port/build/ci-summary.json
          if-no-files-found: ignore
      - *piece
      - *upload-piece

  # Requested full runs only: re-derive every C64 branch cover a certificate
  # cites on the current sources (tools/cover_check.py, host only), as
  # manifest pieces carrying c64_cover. It fails on a cover that misses host
  # branches or cannot be re-derived; tools/cert_precheck.py also reads
  # c64_cover for the certificates a change touches.
  cover-check:
    needs: plan
    env:
      REF: ${{ needs.plan.outputs.sha }}
    if: needs.plan.outputs.full == '1' && (inputs.full || github.event_name == 'schedule')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    steps:
      - *checkout
      - *deps
      - *setup
      - name: Re-derive cited C64 branch covers (shard ${{ matrix.shard }} of 2)
        working-directory: c64-port
        run: |
          source deps/env.sh
          python3 tools/cover_check.py --shard "${{ matrix.shard }}/2" --name "cover-check${{ matrix.shard }}" \
            --out "build/vice-manifest-cover-check${{ matrix.shard }}.json"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vice-manifest-cover-check${{ matrix.shard }}
          path: c64-port/build/vice-manifest-cover-check*.json
          if-no-files-found: ignore

  # The vice manifest (tools/vice_manifest.py): every vice-* target of this
  # full run, its PRG sha256, checks and result, as the `vice-manifest`
  # artifact that tools/cert_precheck.py checks certificates' vice_targets
  # against.
  vice-manifest:
    needs: [plan, c64, c64-legacy, cover-check]
    env:
      REF: ${{ needs.plan.outputs.sha }}
    if: always() && needs.plan.outputs.full == '1' && (inputs.full || github.event_name == 'schedule')
    runs-on: ubuntu-24.04
    steps:
      - *checkout
      - uses: actions/download-artifact@v4
        with:
          pattern: vice-manifest-*
          path: c64-port/build/vice-pieces
          merge-multiple: true
      - name: Merge the vice manifest
        working-directory: c64-port
        env:
          MANIFEST_REF: ${{ inputs.ref || github.ref_name }}
        run: |
          shopt -s nullglob
          python3 tools/vice_manifest.py merge build/vice-pieces/*.json --expect 14 \
            --job "c64=${{ needs.c64.result }}" --job "c64-legacy=${{ needs.c64-legacy.result }}" \
            --job "cover-check=${{ needs.cover-check.result }}" \
            --out build/vice-manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: vice-manifest
          path: c64-port/build/vice-manifest.json
          retention-days: 30
