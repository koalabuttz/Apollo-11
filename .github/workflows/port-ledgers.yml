# Rebuilds the generated ledger indices (README.md, HANDOFF, ROADMAP,
# VERIFICATION, SOURCE_MAP) after each merge into main.
# Lanes only add docs/milestones/<id>.md, so they never conflict on them.
name: port-ledgers
on:
  push:
    branches: [main]
    paths: ['c64-port/docs/milestones/**', 'c64-port/docs/ledgers/**', 'c64-port/tools/ledgers.py']
  workflow_dispatch:

concurrency:
  group: port-ledgers

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          filter: blob:none
          sparse-checkout: |
            /*
            !/c64-port/evidence/*
          sparse-checkout-cone-mode: false
      - name: Rebuild indices
        working-directory: c64-port
        run: |
          python3 tools/ledgers.py
          git add README.md docs/HANDOFF.md docs/ROADMAP.md docs/VERIFICATION.md docs/SOURCE_MAP.md
          if git diff --cached --quiet; then echo 'indices already current'; exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -q -m 'Rebuild port ledger indices'
          git push origin HEAD:main
