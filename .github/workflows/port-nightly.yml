# Nightly full suite for the native C64 port (c64-port/ on port/c64-native-c).
# Schedules only fire from the default branch, so this trigger lives here and
# runs the port branch's own port-ci workflow.
name: port-nightly
on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-suite:
    uses: koalabuttz/Apollo-11/.github/workflows/port-ci.yml@port/c64-native-c
    with:
      ref: port/c64-native-c
      full: true
